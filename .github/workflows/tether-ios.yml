name: Build iOS companion candidate
on:
  push:
    branches: [feature/dsh-tether-ios]
  pull_request:
    paths: ['packages/dsh-tether-ios/**', '.github/workflows/tether-ios.yml']
  workflow_dispatch:
    inputs:
      relay_url:
        description: 'Optional: only run external verification against this HTTPS relay'
        type: string
        default: ''
      probe_run:
        description: 'Successful candidate run providing the relay-probe binary'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: tether-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-arm64:
    if: ${{ !inputs.relay_url }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/dsh-tether-ios/native/target
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare controlled paths and verify architecture
        run: |
          mkdir -p tmp .cache/cargo build/tether-candidate
          test "$(uname -m)" = arm64
          rustc --version
          cargo --version
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/cargo
            packages/dsh-tether-ios/native/target
          key: tether-macos15-rust198-${{ hashFiles('packages/dsh-tether-ios/native/Cargo.lock') }}-${{ github.sha }}
          restore-keys: tether-macos15-rust198-${{ hashFiles('packages/dsh-tether-ios/native/Cargo.lock') }}-
      - name: Unit tests and prebuilt JavaScript
        working-directory: packages/dsh-tether-ios
        run: npm run check
      - name: Build and test locked native host
        working-directory: packages/dsh-tether-ios
        run: npm run build:sidecar
      - name: Build synthetic relay-only deployment probe
        working-directory: packages/dsh-tether-ios
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path native/Cargo.toml -p tether-host --example relay-probe
          cp native/target/aarch64-apple-darwin/release/examples/relay-probe "$GITHUB_WORKSPACE/build/tether-candidate/relay-probe"
      - name: Validate native package
        working-directory: packages/dsh-tether-ios
        run: npm run verify:artifact
      - name: Install only version-pinned API test dependencies inside CI
        working-directory: packages/dsh-tether-ios
        run: |
          mkdir -p tmp/api
          printf '{"private":true,"type":"module"}\n' > tmp/api/package.json
          npm install --prefix tmp/api --ignore-scripts --no-audit --no-fund --save-exact @deepseek-ai/cordis@4.0.4 @deepseek-ai/dsh-host-webserver@0.2.0-rc.2 @deepseek-ai/dsh-client-connection@0.2.0-rc.2
      - name: Actual DSH API lifecycle and parent-exit verification
        working-directory: packages/dsh-tether-ios
        run: node test/ci-runtime.mjs
      - name: License inventory and controlled candidate archive
        working-directory: packages/dsh-tether-ios
        run: node scripts/candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-tether-ios-darwin-arm64-${{ github.sha }}
          path: build/tether-candidate/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled()
        with:
          path: |
            .cache/cargo
            packages/dsh-tether-ios/native/target
          key: tether-macos15-rust198-${{ hashFiles('packages/dsh-tether-ios/native/Cargo.lock') }}-${{ github.sha }}

  external-relay:
    if: ${{ inputs.relay_url != '' }}
    runs-on: macos-15
    timeout-minutes: 12
    env:
      RELAY_URL: ${{ inputs.relay_url }}
      PROBE_RUN: ${{ inputs.probe_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate input and verify external IPv4 HTTPS endpoint
        run: |
          python3 - <<'PYCODE'
          import os, urllib.parse
          u=urllib.parse.urlsplit(os.environ['RELAY_URL'])
          assert u.scheme=='https' and u.hostname and not u.username and not u.password and not u.query and not u.fragment and u.path in ('','/')
          assert os.environ['PROBE_RUN'].isdigit()
          PYCODE
          curl -4 --fail --silent --show-error --max-time 20 "${RELAY_URL%/}/healthz" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok" and d["version"]=="1.0.3"; print("external IPv4 HTTPS health verified")'
      - name: Download previously validated synthetic probe
        run: |
          mkdir -p probe identities
          gh run download "$PROBE_RUN" --dir probe
          PROBE=$(find probe -type f -name relay-probe)
          test -n "$PROBE"
          chmod 755 "$PROBE"
          echo "PROBE=$PROBE" >> "$GITHUB_ENV"
          "$PROBE" init --directory "$GITHUB_WORKSPACE/identities"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: relay-probe-public-ids
          path: identities/public-ids.json
          retention-days: 1
          if-no-files-found: error
      - name: Await allowlist provisioning and exercise actual relay transport
        run: |
          # Private synthetic keys stay on this ephemeral runner and are never uploaded.
          sleep 90
          for ATTEMPT in 1 2 3 4; do
            if "$PROBE" check --directory "$GITHUB_WORKSPACE/identities" --relay "$RELAY_URL" --public-phone; then
              exit 0
            fi
            sleep 15
          done
          exit 1
